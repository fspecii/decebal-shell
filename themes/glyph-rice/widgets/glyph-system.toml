format = 1
id = "glyph-system"
name = "Glyph system"
size = [700, 220]
refresh = 1000

[root]
type = "row"
padding = 28
gap = 20
background = "popup"
radius = 42

[[root.children]]
type = "col"
gap = 12
width = 120

[[root.children.children]]
type = "text"
text = "CPU"
size = 11
color = "text_secondary"

[[root.children.children]]
type = "dot-text"
text = "{cpu.usage:pct|\u2013}"
size = 30

[[root.children.children]]
type = "text"
text = "DISK"
size = 11
color = "text_secondary"

[[root.children.children]]
type = "dot-text"
text = "{disk.usage:pct|\u2013}"
size = 30

[[root.children]]
type = "col"
gap = 12
width = 155

[[root.children.children]]
type = "text"
text = "MEMORY"
size = 11
color = "text_secondary"

[[root.children.children]]
type = "text"
text = "{mem.used:bytes|Unavailable}"
size = 26

[[root.children.children]]
type = "text"
text = "USED"
size = 11
color = "text_secondary"

[[root.children.children]]
type = "dot-text"
text = "{mem.usage:pct|\u2013}"
size = 30

[[root.children]]
type = "col"
gap = 20

[[root.children.children]]
type = "text"
text = "CPU \u00b7 HISTORY"
size = 11
color = "text_secondary"

[[root.children.children]]
type = "graph"
series = "cpu.history"
show_if = "cpu.history"
fill = false
height = 100
width = 285
max = 1
color = "text"

[[root.children.children]]
type = "text"
text = "Unavailable"
size = 14
color = "text_secondary"
show_if = "!cpu.history"
