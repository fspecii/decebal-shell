format = 1
id = "terminal-amber"
name = "Terminal Amber"
version = "1.0.0"
author = "decebal"
license = "MIT"
description = "The amber-phosphor sibling of Terminal Minimal: warm amber on black, same tiny bar, no dock, square monospace everything. The light variant is brown ink on cream paper."
min_shell_version = "0.1.0"
tags = ["dark", "light", "terminal", "minimal", "amber", "phosphor", "monospace"]
screenshots = ["screenshots/main.png"]
extends = "terminal-minimal"

[colors.dark]
background = "#050300"
sidebar = "#0a0700"
surface = "#120c02"
bar = "#050300"
bar_text = "#ffb000"
popup = "#0a0700"
dock = "#050300"
overlay = "#0a0700"
titlebar = "#120c02"
titlebar_inactive = "#050300"
border = "#6b4a00"
text = "#ffb000"
text_secondary = "#d99700"
text_faint = "#9a6c00"
accent = "#ffcc33"
accent_text = "#1a1000"
danger = "#ff5555"
ok = "#ffb000"
warn = "#ffe066"

[colors.light]
background = "#f7f0e2"
sidebar = "#efe5d0"
surface = "#fdf9ef"
bar = "#f7f0e2"
bar_text = "#4a2f00"
popup = "#fdf9ef"
dock = "#f7f0e2"
overlay = "#fdf9ef"
titlebar = "#efe5d0"
titlebar_inactive = "#f7f0e2"
border = "#d1bf9a"
text = "#4a2f00"
text_secondary = "#6b4700"
text_faint = "#8a6a30"
accent = "#8a4b00"
accent_text = "#ffffff"
danger = "#b3120f"
ok = "#6b4700"
warn = "#7a5a00"

[wallpaper]
image = "wallpapers/phosphor.png"
color = "#050300"

[rdwm]
focused_border = "#ffb000"
normal_border = "#6b4a00"
