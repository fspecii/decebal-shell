format = 1
id = "rose-pine"
name = "Rose Pine"
version = "1.0.0"
author = "decebal"
license = "MIT"
description = "Rose Pine dusk (Dawn in light mode): muted rose, gold and iris on a plum night, with a pill bar along the top edge, a round macOS-style dock and traffic-light titlebars."
min_shell_version = "0.1.0"
tags = ["rose-pine", "pill", "top-bar", "dock", "dark", "light"]

[metrics]
radius = 18
dock_roundness = 1.0
dock_alpha = 0.82
popup_alpha = 0.96
panel_alpha = 0.97
shadow = 1.3
outline = 0.08

[font]
preset = "inter"
title = ["Inter Display", "Inter"]
mono = ["JetBrains Mono", "Noto Sans Mono"]

[wallpaper]
image = "wallpapers/dusk.jpg"
mode = "fill"
color = "#191724"

[decoration]
style = "macos"
height = 32
radius = 14

[rdwm]
gap_inner = 12
gap_outer = 14
border_px = 2
focused_border = "#ebbcba"
normal_border = "#26233a"
urgent_border = "#eb6f92"

[bar]
enabled = true
style = "vertical"
position = "top"

[dock]
enabled = true
style = "mac"
size = 56
roundness = 1.0
magnification = 1.7

[icons]
fallback = "Adwaita"

[hot_corners]
top_right = "dashboard"
bottom_left = "overview"
dwell_ms = 200

[colors.dark]
background = "#191724"
sidebar = "#1f1d2e"
surface = "#26233a"
bar = "#1f1d2e"
bar_text = "#e0def4"
popup = "#26233a"
dock = "#26233a"
overlay = "#26233a"
titlebar = "#26233a"
titlebar_inactive = "#1f1d2e"
border = "#403d52"
text = "#e0def4"
text_secondary = "#c6c3dc"
text_faint = "#908caa"
accent = "#ebbcba"
accent_text = "#191724"
danger = "#eb6f92"
ok = "#9ccfd8"
warn = "#f6c177"

[colors.light]
background = "#faf4ed"
sidebar = "#fffaf3"
surface = "#f2e9e1"
bar = "#f2e9e1"
bar_text = "#575279"
popup = "#fffaf3"
dock = "#f2e9e1"
overlay = "#fffaf3"
titlebar = "#fffaf3"
titlebar_inactive = "#fffaf3"
border = "#dfdad9"
text = "#575279"
text_secondary = "#6e6a86"
text_faint = "#797593"
accent = "#286983"
accent_text = "#faf4ed"
danger = "#b4637a"
ok = "#3e7d5c"
warn = "#a8600c"
