format = 1
id = "dux-lavender"
name = "Dux Lavender"
version = "1.2.0"
author = "Decebal Theme Specialist; palette adapted from Dux Labs"
license = "MIT"
description = "Dux port: stock Purple bar, historical README dashboard, Control Center and Applications list launcher (section 4). Partial source fidelity; full replica parity is not claimed. Wallpaper stays independent."
min_shell_version = "0.2.0"
tags = ["dux-inspired", "material", "lavender", "native-widgets", "dark-light"]

[colors.dark]
background = "#141218"
sidebar = "#211f24"
surface = "#211f24"
bar = "#211f24"
bar_text = "#e6e0e9"
popup = "#211f24"
dock = "#211f24"
overlay = "#141218"
titlebar = "#211f24"
titlebar_inactive = "#1d1b20"
border = "#948f99"
text = "#e6e0e9"
text_secondary = "#cac4cf"
text_faint = "#aaa4b0"
accent = "#D0BCFF"
accent_text = "#381E72"
danger = "#ffb4ab"
ok = "#b5cea8"
warn = "#e9c47a"

[colors.light]
background = "#fef7ff"
sidebar = "#f2ecf4"
surface = "#f2ecf4"
bar = "#f2ecf4"
bar_text = "#1d1b20"
popup = "#f2ecf4"
dock = "#f2ecf4"
overlay = "#fef7ff"
titlebar = "#f2ecf4"
titlebar_inactive = "#f4eef6"
border = "#7a757f"
text = "#1d1b20"
text_secondary = "#49454e"
text_faint = "#625d68"
accent = "#6750A4"
accent_text = "#ffffff"
danger = "#ba1a1a"
ok = "#45663a"
warn = "#795900"

[metrics]
radius = 12
bar_alpha = 1.0
dock_alpha = 0.96
popup_alpha = 1.0
panel_alpha = 1.0
dock_roundness = 0.55
dock_padding = 8
outline = 0
blur = 0.15
glass_refraction = 0
glass_edge = 2
glass_highlight = 0.08
glass_grain = 0
glass_blur = 3
shadow = 0.45

[font]
files = ["fonts/GoogleSansFlex-400.ttf", "fonts/GoogleSansFlex-500.ttf", "fonts/GoogleSansFlex-700.ttf", "fonts/MaterialSymbolsRounded.ttf", "fonts/GoogleSansFlex-Variable.ttf"]
ui = ["Google Sans Flex", "Noto Sans"]
title = ["Google Sans Flex", "Noto Sans"]
mono = ["Adwaita Mono", "JetBrains Mono", "monospace"]
display = ["Google Sans Flex", "Noto Sans"]
scale = 1.0

[decoration]
style = "materia"
# The side is decided by Materia; this hint also explicitly enables all buttons.
buttons = "right"
height = 32
radius = 12
title_align = "left"

[rdwm]
gap_inner = 10
gap_outer = 16
border_px = 1
smart_gaps = false
mfact = 0.56
layouts = ["tile", "monocle", "floating"]

[bar]
enabled = true
style = "dux"
position = "top"
height = 38
background = "band"
margin = 4
spacing = 4
band_radius = 16
radius = 14
left = ["launcherButton", "workspaceSwitcher", "focusedWindow"]
center = ["music", "clock", "weather"]
right = ["systemTray", "clipboard", "cpuUsage", "memUsage", "notificationButton", "battery", "controlCenterButton"]

[dock]
enabled = false
style = "mac"

[icons]
theme = "Adwaita"
fallback = "hicolor"
monochrome_tint = false

[control_center]
enabled = true
position = "top-right"
style = "dux"

[dashboard]
style = "dux"
profile = "readme"

[desktop]
widgets = "none"

[hot_corners]
top_right = "control-center"

[launcher]
style = "dux"
