format = 1
id = "gruvbox-dark"
name = "Gruvbox Dark"
version = "1.0.0"
author = "decebal"
license = "MIT"
description = "Warm retro tiling rice: thin top bar, square corners, tight gaps, cream on charcoal and earthy orange accents. Includes a light paper variant."
min_shell_version = "0.1.0"
tags = ["gruvbox", "retro", "warm", "tiling", "square", "dark", "light"]

[colors.dark]
background = "#282828"
sidebar = "#1d2021"
surface = "#32302f"
bar = "#1d2021"
bar_text = "#ebdbb2"
popup = "#3c3836"
dock = "#1d2021"
overlay = "#3c3836"
titlebar = "#3c3836"
titlebar_inactive = "#282828"
border = "#504945"
text = "#ebdbb2"
text_secondary = "#d5c4a1"
text_faint = "#928374"
accent = "#fe8019"
accent_text = "#1d2021"
danger = "#fb4934"
ok = "#b8bb26"
warn = "#fabd2f"

[colors.light]
background = "#fbf1c7"
sidebar = "#ebdbb2"
surface = "#f2e5bc"
bar = "#ebdbb2"
bar_text = "#3c3836"
popup = "#f2e5bc"
dock = "#ebdbb2"
overlay = "#f2e5bc"
titlebar = "#ebdbb2"
titlebar_inactive = "#f2e5bc"
border = "#d5c4a1"
text = "#3c3836"
text_secondary = "#504945"
text_faint = "#7c6f64"
accent = "#af3a03"
accent_text = "#fbf1c7"
danger = "#9d0006"
ok = "#79740e"
warn = "#b57614"

[metrics]
radius = 0
dock_roundness = 0.0
dock_alpha = 1.0
popup_alpha = 1.0
panel_alpha = 1.0
bar_alpha = 1.0
shadow = 0.4
outline = 0.18
dock_padding = 8

[font]
ui = ["JetBrains Mono", "Noto Sans Mono", "DejaVu Sans Mono"]
title = ["JetBrains Mono", "DejaVu Sans Mono"]
mono = ["JetBrains Mono", "DejaVu Sans Mono"]
scale = 0.95

[decoration]
style = "gruvbox"
height = 24
radius = 0
title_align = "left"

[rdwm]
gap_inner = 6
gap_outer = 6
border_px = 2
smart_gaps = false
mfact = 0.55
layouts = ["tile", "monocle"]
focused_border = "#fe8019"
normal_border = "#3c3836"
urgent_border = "#fb4934"

[bar]
enabled = true
style = "flat"
height = 22

[dock]
enabled = true
style = "mac"
size = 40
align = "center"
roundness = 0.0

[icons]
theme = "Adwaita"
size_scale = 0.9

[hot_corners]
top_right = "dashboard"
