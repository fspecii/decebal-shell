format = 1
id = "terminal-minimal"
name = "Terminal Minimal"
version = "1.0.0"
author = "decebal"
license = "MIT"
description = "Ultra-light and terminal-flavoured: green phosphor on black, a tiny 20 px bar, no dock at all, a thin borderless-looking titlebar strip, square corners and monospace type. A plain monospace clock sits straight on the desktop. The light variant is dark green ink on paper. For amber phosphor see terminal-amber."
min_shell_version = "0.1.0"
tags = ["dark", "light", "terminal", "minimal", "green", "phosphor", "monospace"]

[metrics]
radius = 0
dock_roundness = 0.0
dock_alpha = 1.0
popup_alpha = 1.0
panel_alpha = 1.0
bar_alpha = 1.0
shadow = 0.0
outline = 0.5
dock_padding = 6

[font]
preset = "monospace-ui"
ui = ["JetBrains Mono", "Fira Code", "DejaVu Sans Mono"]
title = ["JetBrains Mono", "Fira Code", "DejaVu Sans Mono"]
mono = ["JetBrains Mono", "Fira Code", "DejaVu Sans Mono"]
display = ["JetBrains Mono", "Fira Code", "DejaVu Sans Mono"]
scale = 0.95

[colors.dark]
background = "#030603"
sidebar = "#050a06"
surface = "#07110a"
bar = "#030603"
bar_text = "#33ff66"
popup = "#050a06"
dock = "#030603"
overlay = "#050a06"
titlebar = "#07110a"
titlebar_inactive = "#030603"
border = "#14532d"
text = "#33ff66"
text_secondary = "#22c55e"
text_faint = "#178a3e"
accent = "#66ff99"
accent_text = "#021a08"
danger = "#ff5555"
ok = "#33ff66"
warn = "#e0e040"

[colors.light]
background = "#f2f5ee"
sidebar = "#e6ebe0"
surface = "#fbfcf8"
bar = "#f2f5ee"
bar_text = "#0b3d1a"
popup = "#fbfcf8"
dock = "#f2f5ee"
overlay = "#fbfcf8"
titlebar = "#e6ebe0"
titlebar_inactive = "#f2f5ee"
border = "#b4c4aa"
text = "#0b3d1a"
text_secondary = "#1f5a2e"
text_faint = "#4d7a58"
accent = "#0a6b2a"
accent_text = "#ffffff"
danger = "#b3120f"
ok = "#0a6b2a"
warn = "#7a5a00"

[decoration]
style = "minimal"
height = 20
radius = 0
title_align = "left"

[rdwm]
gap_inner = 4
gap_outer = 4
border_px = 1
smart_gaps = true
focused_border = "#33ff66"
normal_border = "#14532d"
urgent_border = "#ff5555"

[bar]
enabled = true
style = "flat"
height = 20

[dock]
enabled = false

[hot_corners]
top_right = "dashboard"

[[widgets]]
use = "tty-clock"
place = "desktop"
anchor = "top-right"
x = -40
y = 48
