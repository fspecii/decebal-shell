format = 1
id = "tty-clock"
name = "TTY clock"
description = "Plain monospace time and load on the desktop, a thin bordered box like a tty banner."
size = [250, 96]
refresh = 1000

[root]
type = "col"
padding = [8, 12]
gap = 2
justify = "start"
background = "surface@0.9"
radius = 0
border = "border"

[[root.children]]
type = "text"
text = "{clock:%H:%M:%S}"
size = 40
weight = "bold"
color = "accent"

[[root.children]]
type = "text"
text = "$ {user.name}@{host.name}   load {cpu.load}"
size = 12
color = "text_secondary"
