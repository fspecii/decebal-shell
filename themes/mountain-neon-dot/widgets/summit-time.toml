format = 1
id = "summit-time"
name = "Summit time"
size = [340, 44]
refresh = 1000
[root]
type = "col"
gap = 2
background = "bar"
radius = 10
padding = [8, 5, 8, 0]
border = "border@0.5"
[[root.children]]
type = "text"
text = "{clock:%H:%M:%S · %a %d.%m}  {weather.temp:int|—}°C"
size = 13
color = "accent"

[[root.children]]
type = "row"
gap = 0
height = 2
[[root.children.children]]
type = "spacer"
width = 162.0
height = 2
background = "accent"
[[root.children.children]]
type = "spacer"
width = 162.0
height = 2
background = "ok"
