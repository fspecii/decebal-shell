format = 1
id = "orbit-glass"
name = "Orbit Glass"
version = "2.0.0"
author = "decebal"
license = "MIT"
description = "An orbital command deck: right glass navigation rail and precise window chrome, with no bottom dock."
min_shell_version = "0.1.0"
tags = ["glass", "orbital", "right-rail", "command-deck"]

[colors.dark]
background = "#101726"
sidebar = "#141e30"
surface = "#1b2940"
bar = "#131e30"
bar_text = "#eef7ff"
popup = "#1b2940"
dock = "#162237"
overlay = "#1b2940"
titlebar = "#1c2a40"
titlebar_inactive = "#162134"
border = "#52637c"
text = "#eef7ff"
text_secondary = "#c2d2e5"
text_faint = "#9db0c8"
accent = "#9adced"
accent_text = "#102331"
danger = "#ff9eac"
ok = "#9bdec2"
warn = "#f3d394"

[colors.light]
background = "#edf2f8"
sidebar = "#e1e9f3"
surface = "#f8fbff"
bar = "#e8eff8"
bar_text = "#182a40"
popup = "#f8fbff"
dock = "#e5edf7"
overlay = "#f8fbff"
titlebar = "#e1eaf5"
titlebar_inactive = "#eaf0f8"
border = "#8496af"
text = "#182a40"
text_secondary = "#455b75"
text_faint = "#5c708a"
accent = "#275d90"
accent_text = "#ffffff"
danger = "#a42747"
ok = "#246147"
warn = "#805b14"

[metrics]
glass_refraction = 7
glass_edge = 10
glass_highlight = 0.25
glass_grain = 0.003
glass_blur = 5
radius = 16
dock_roundness = 0.52
dock_alpha = 0.22
popup_alpha = 0.88
panel_alpha = 0.90
bar_alpha = 0.18
shadow = 1.15
blur = 0.80
outline = 0.24
dock_padding = 8

[font]
ui = ["Adwaita Sans", "Inter", "Noto Sans"]
title = ["JetBrainsMono Nerd Font", "Adwaita Mono", "monospace"]
mono = ["JetBrainsMono Nerd Font", "Adwaita Mono", "monospace"]
display = ["Adwaita Sans", "Inter"]
scale = 1.0

[decoration]
style = "minimal"
height = 28
radius = 10
title_align = "center"

[rdwm]
gap_inner = 16
gap_outer = 20
border_px = 1
smart_gaps = false
mfact = 0.60
layouts = ["tile", "monocle", "floating"]

[bar]
enabled = true
style = "vertical"
position = "right"
height = 28

[dock]
enabled = false
style = "mac"
size = 42
roundness = 0.52
magnification = 1.0

[control_center]
enabled = true
position = "top-right"
style = "card"

[hot_corners]
top_right = "control-center"
