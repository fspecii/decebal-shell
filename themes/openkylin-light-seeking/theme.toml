format = 1
id = "openkylin-light-seeking"
name = "openKylin (Light-Seeking 寻光)"
version = "1.0.0"
author = "decebal"
license = "MIT"
description = "UKUI's Light-Seeking (寻光) global theme: the azure #3790FA brand, opaque grey menus and the default icon pack as its suggestion."
homepage = "https://github.com/openkylin"
min_shell_version = "0.3.0"
tags = ["openkylin", "ukui", "azure", "light-seeking"]

# Generated by assets/desktop-ports/openkylin/tools/build_packages.py from the UKUI `Light-Seeking` global theme tables
# (ukui-globaltheme @ 83cb8ff). Do not edit the colour blocks by hand: change the mapping tool and regenerate.

[metrics]
radius = 12
dock_roundness = 0.0
dock_alpha = 0.65
bar_alpha = 0.65
popup_alpha = 1.0
panel_alpha = 0.9
blur = 0.6
shadow = 1.0
outline = 0.1

[font]
ui = ["Noto Sans CJK SC", "Noto Sans"]
title = ["Noto Sans CJK SC", "Noto Sans"]

# Mode-aware window style (generic contract): the measured openKylin pair when the RUNNING rdwm lists it, else the proven fallback. `style` is what
# older engines read. The native pair carries UKUI's own geometry (38 px header, 30 px plates), so no height is set; Classic's global theme has
# window-radius 0, so it alone overrides the radius.
[decoration]
style = "adwaita"
style_light = "openkylin"
style_dark = "openkylin-dark"
fallback_style_light = "adwaita-light"
fallback_style_dark = "adwaita"

[branding]
logo = "icons/kylin-startmenu.png"
logo_tint = false

# ukui-sidebar's shortcut panel (396 wide, 4-column icon shortcuts, progress rows) and ukui-menu's start menu (766 x 688, three columns), as native styles
[control_center]
style = "ukui"

[launcher]
style = "ukui"

[dock]
enabled = true
style = "windows"
position = "bottom"
align = "left"
size = 32
roundness = 0.0

# ukui-panel classic taskbar (panel.cpp, AppIcon.qml): a 48 px strip (size policy Small), square 48 px cells, a task plate inset 4 px (radius kRadiusNormal 6 =
# theme radius / 2), and a 32 px icon (another 4 px inset). Generic typed `[taskbar]` keys; no theme id is involved.
[taskbar]
thickness = 48
icon_size = 32
cell_width = 48
gap = 0
inset = 4

[bar]
enabled = "auto"
applets = ["launcher", "search", "tasks", "tray", "volume", "network", "bluetooth", "battery", "control_center", "clock", "show_desktop"]

# UKUI's only desktop widget (the time appwidget), saved but switched off: UKUI's desktop has none by default. Turn it on in Settings -> Widgets.
[[widgets]]
use = "ukui-time-24"
place = "desktop"
anchor = "top-right"
x = -480
y = 96
enabled = false

[colors.dark]
background = "#2e2e2e"
sidebar = "#2e2e2e"
surface = "#1e1e1e"
bar = "#2e2e2e"
popup = "#2e2e2e"
dock = "#2e2e2e"
overlay = "#2e2e2e"
titlebar = "#2e2e2e"
titlebar_inactive = "#2e2e2e"
border = "#434343"
text_secondary = "#ababab"
text_faint = "#ababab"
bar_text = "#eaeaea"
text = "#eaeaea"
accent = "#3790fa"
accent_text = "#000000"
danger = "#f04943"
ok = "#14a621"
warn = "#fa7d0f"

[colors.light]
background = "#f6f6f6"
sidebar = "#f2f2f2"
surface = "#ffffff"
bar = "#f6f6f6"
popup = "#f6f6f6"
dock = "#f6f6f6"
overlay = "#f6f6f6"
titlebar = "#f6f6f6"
titlebar_inactive = "#f6f6f6"
border = "#dddddd"
text_secondary = "#626262"
text_faint = "#626262"
bar_text = "#252525"
text = "#252525"
accent = "#3790fa"
accent_text = "#ffffff"
danger = "#f53f3f"
ok = "#00b42a"
warn = "#ff7d00"
