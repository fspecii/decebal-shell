format = 1
id = "openkylin-islands"
name = "openKylin (UKUI islands)"
version = "1.0.0"
author = "decebal"
license = "MIT"
description = "The v11 palettes with UKUI's three-island floating taskbar: data, application and settings islands along the bottom edge."
homepage = "https://github.com/openkylin"
min_shell_version = "0.3.0"
tags = ["openkylin", "ukui", "islands", "floating"]

# Generated by assets/desktop-ports/openkylin/tools/build_packages.py from the UKUI `v11` global theme tables
# (ukui-globaltheme @ 83cb8ff). Do not edit the colour blocks by hand: change the mapping tool and regenerate.

[metrics]
radius = 12
dock_roundness = 0.4
dock_alpha = 0.65
bar_alpha = 0.65
popup_alpha = 0.82
panel_alpha = 0.9
blur = 0.6
shadow = 1.0
outline = 0.25

[font]
ui = ["Noto Sans CJK SC", "Noto Sans"]
title = ["Noto Sans CJK SC", "Noto Sans"]

# Mode-aware window style (generic contract): the measured openKylin pair when the RUNNING rdwm lists it, else the proven fallback. `style` is what
# older engines read. The native pair carries UKUI's own geometry (38 px header, 30 px plates), so no height is set; Classic's global theme has
# window-radius 0, so it alone overrides the radius.
[decoration]
style = "adwaita"
style_light = "openkylin"
style_dark = "openkylin-dark"
fallback_style_light = "adwaita-light"
fallback_style_dark = "adwaita"

[branding]
logo = "icon:kylin-startmenu"
logo_tint = false

# ukui-sidebar: a 400 px side panel of 6-8 px-radius shortcut tiles (not the big rounded macOS-style cards): the theme-radius flyout is closest
[control_center]
style = "fluent"

[dock]
enabled = false

# ukui-panel island taskbar (panelNext): ONE content-sized run of three islands centred on the bottom edge. Source numbers (MainContainer.qml, ApplicationsIsland.qml,
# panel-next.cpp): islands 48 px high (56 strip - 2 x 4), radius 12 (kRadiusWindow), 8 px between islands, 12 px padding inside the application island, 4 px between
# items, and 12 px above the screen edge. Dux face = bar height - 10, face top = margin + 5, so height 58 / margin 7 give 48 px faces standing 12 px above the edge.
# data island = start button; application island = tasks + search; settings island = tray, status applets, clock (the group lists use applet keys).
[bar]
enabled = true
style = "dux"
background = "islands"
cluster = true
position = "bottom"
height = 58
margin = 7
spacing = 4
radius = 12
band_radius = 12
group_gap = 8
group_padding = 12
applets = ["launcher", "tasks", "search", "tray", "volume", "network", "bluetooth", "battery", "control_center", "clock"]
left = ["launcher"]
center = ["tasks", "search"]
right = ["tray", "volume", "network", "bluetooth", "battery", "control_center", "clock"]

# UKUI's only desktop widget (the time appwidget), saved but switched off: UKUI's desktop has none by default. Turn it on in Settings -> Widgets.
[[widgets]]
use = "ukui-time-24"
place = "desktop"
anchor = "top-right"
x = -480
y = 96
enabled = false

[colors.dark]
background = "#2e2e2e"
sidebar = "#2e2e2e"
surface = "#1a1a1a"
bar = "#2e2e2e"
popup = "#272727"
dock = "#2e2e2e"
overlay = "#272727"
titlebar = "#2e2e2e"
titlebar_inactive = "#333333"
border = "#494949"
text_secondary = "#959595"
text_faint = "#8c8c8c"
bar_text = "#e6e6e6"
text = "#e6e6e6"
accent = "#3676f5"
accent_text = "#fbfcff"
danger = "#eb4646"
ok = "#18a80d"
warn = "#ff801f"

[colors.light]
background = "#f5f5f5"
sidebar = "#f0f0f0"
surface = "#ffffff"
bar = "#f5f5f5"
popup = "#f5f5f5"
dock = "#f5f5f5"
overlay = "#f5f5f5"
titlebar = "#f5f5f5"
titlebar_inactive = "#f0f0f0"
border = "#e1e1e1"
text_secondary = "#707070"
text_faint = "#8e8e8e"
bar_text = "#1d1d1d"
text = "#1d1d1d"
accent = "#3676f5"
accent_text = "#fbfcff"
danger = "#f54949"
ok = "#18a80d"
