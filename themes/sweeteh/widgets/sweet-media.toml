format = 1
id = "sweet-media"
name = "Sweeteh Media"
size = [456, 224]
refresh = 1000

[root]
type = "stack"
background = "accent"
radius = 26
padding = [0, 0, 0, 4]

[[root.children]]
type = "col"
background = "popup"
radius = 26
border = "text@0.20"
padding = 20
gap = 8

[[root.children.children]]
type = "text"
text = "MEDIA"
size = 12
color = "accent"

[[root.children.children]]
type = "text"
text = "{media.title|No active player}"
max_chars = 28
size = 24

[[root.children.children]]
type = "text"
text = "{media.artist|Media unavailable}"
max_chars = 36
size = 15
color = "text_secondary"

[[root.children.children]]
type = "bar"
value = "media.progress"
height = 3
show_if = "media.present"
color = "accent"

[[root.children.children]]
type = "button"
width = 44
height = 36
background = "accent"
radius = 18
on_click = "media play-pause"
show_if = "media.present"

[[root.children.children.children]]
type = "icon"
name = "pause"
size = 20
color = "accent_text"
show_if = "media.playing"

[[root.children.children.children]]
type = "icon"
name = "play"
size = 20
color = "accent_text"
show_if = "!media.playing"
