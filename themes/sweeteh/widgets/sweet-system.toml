format = 1
id = "sweet-system"
name = "Sweeteh System"
size = [456, 184]
refresh = 1000

[root]
type = "stack"
background = "accent"
radius = 26
padding = [0, 0, 0, 4]

[[root.children]]
type = "col"
background = "popup"
radius = 26
border = "text@0.20"
padding = 20
gap = 8

[[root.children.children]]
type = "text"
text = "SYSTEM LOAD"
size = 12
color = "accent"

[[root.children.children]]
type = "text"
text = "CPU {cpu.usage:pct|—} · RAM {mem.usage:pct|—}"
size = 17

[[root.children.children]]
type = "graph"
series = "cpu.history"
height = 60
color = "accent"
fill = false
show_if = "cpu.history"

[[root.children.children]]
type = "text"
text = "History unavailable"
size = 14
color = "text_secondary"
show_if = "!cpu.history"
