format = 1
id = "sweet-calendar"
name = "Sweeteh Calendar"
size = [456, 224]
refresh = 1000

[root]
type = "stack"
background = "accent"
radius = 26
padding = [0, 0, 0, 4]

[[root.children]]
type = "row"
background = "popup"
radius = 26
border = "text@0.20"
padding = 24
gap = 28

[[root.children.children]]
type = "col"
width = 160
gap = 8

[[root.children.children.children]]
type = "text"
text = "{clock:%d}"
size = 64

[[root.children.children.children]]
type = "text"
text = "{clock:%A}"
size = 15
color = "text_secondary"

[[root.children.children]]
type = "col"
gap = 12

[[root.children.children.children]]
type = "text"
text = "{clock:%B}"
size = 22

[[root.children.children.children]]
type = "text"
text = "{clock:%Y}"
size = 16
color = "text_secondary"

[[root.children.children.children]]
type = "text"
text = "LOCAL CALENDAR"
size = 11
color = "accent"
