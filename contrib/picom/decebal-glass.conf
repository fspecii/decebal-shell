# Include these options in an X11 picom configuration (picom 13+).
# Only Decebal surfaces requesting a theme's glass material get background blur.
blur: {
  method = "dual_kawase";
  strength = 5;
};
rules = (
  { blur-background = false; },
  { match = "_DECEBAL_BLUR@ = 1"; blur-background = true; },
  # rdwm's unified SSD carrier supplies the shadow for the whole window.
  # Merge these into your existing rules array; keep no-frame-pacing unchanged.
  { match = "_RDWM_SSD_SHADOW@ = 1"; shadow = false; corner-radius = 0; },
  { match = "_RDWM_SHADOW_OWNER@"; shadow = false; blur-background = false; corner-radius = 0; }
);
