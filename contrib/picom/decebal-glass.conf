# Include these options in an X11 picom configuration (picom 13+).
# Only Decebal surfaces requesting a theme's glass material get background blur.
blur: {
  method = "dual_kawase";
  strength = 5;
};
rules = (
  { blur-background = false; },
  { match = "_DECEBAL_BLUR@ = 1"; blur-background = true; }
);
