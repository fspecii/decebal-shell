name: Feature request
description: Suggest something Decebal should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like Decebal to do?
      description: Decebal stays small; say whether a theme, widget or config option could cover it instead.
  - type: textarea
    id: alternatives
    attributes:
      label: What do other window managers (dwm, niri, sway, i3, KDE, ...) do here?
