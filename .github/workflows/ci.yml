name: ci
on:
  push:
    branches: [master]
  pull_request:

# New PR revisions supersede old checks; master publication runs are preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libpam0g-dev pkg-config fontconfig fonts-inter fonts-dejavu-core fonts-noto-cjk python3 util-linux dbus
      - name: Developer workload guard regressions
        run: python3 tests/desktop-job.py
      - name: Artifact byte receipt regressions
        run: python3 tests/artifact-snapshot.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libpam0g-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: sh packaging/deb/build.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: decebal-deb
          path: dist/*.deb
