[package]
name = "macshell"
version = "0.1.0"
edition = "2021"
description = "Lightweight macOS-style dock, menu bar and wallpaper browser for Wayland and X11"
license = "MIT"
readme = "README.md"
rust-version = "1.85"
resolver = "3"

[lib]
name = "macshell"
path = "src/lib.rs"

[[bin]]
name = "macdock"
path = "src/bin/macdock.rs"

[[bin]]
name = "macbar"
path = "src/bin/macbar.rs"

[[bin]]
name = "machaven"
path = "src/bin/machaven.rs"

[dependencies]
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
tiny-skia = "0.11"
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fontdue = "0.9"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"], optional = true }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"], optional = true }
x11rb = { version = "0.13", optional = true, features = ["shape", "randr", "xfixes", "xtest"] }

[features]
default = ["wayland", "x11"]
wayland = ["dep:smithay-client-toolkit", "dep:wayland-protocols"]
x11 = ["dep:x11rb"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "macsettings"
path = "src/bin/macsettings.rs"

[[bin]]
name = "macnotify"
path = "src/bin/macnotify.rs"
required-features = ["x11"]

[[bin]]
name = "macwm"
path = "src/bin/macwm.rs"

[[bin]]
name = "maclaunch"
path = "src/bin/maclaunch.rs"

[[bin]]
name = "macspot"
path = "src/bin/macspot.rs"

[[bin]]
name = "macswitch"
path = "src/bin/macswitch.rs"
required-features = ["x11"]

[[bin]]
name = "machud"
path = "src/bin/machud.rs"
required-features = ["x11"]

[[bin]]
name = "macclip"
path = "src/bin/macclip.rs"
required-features = ["x11"]

[[bin]]
name = "macsession"
path = "src/bin/macsession.rs"

[[bin]]
name = "macutil"
path = "src/bin/macutil.rs"

[[bin]]
name = "macthemectl"
path = "src/bin/macthemectl.rs"
# Wallpaper thumbnails decode 4K-8K images: unusably slow unoptimised (debug runs and tests).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
