[package]
name = "decebal"
version = "0.3.0"
edition = "2021"
description = "Decebal: a customisable, rice-friendly desktop environment for rdwm (dock, bar, launcher, settings, themes) for Wayland and X11"
license = "MIT"
readme = "README.md"
rust-version = "1.85"
resolver = "3"

[lib]
name = "decebal"
path = "src/lib.rs"

[[bin]]
name = "decdock"
path = "src/bin/decdock.rs"

[[bin]]
name = "decbar"
path = "src/bin/decbar.rs"

[[bin]]
name = "dechaven"
path = "src/bin/dechaven.rs"

[dependencies]
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tiny-skia = "0.12"
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# gzip for the .decebal-preset bundles (already in the tree through png/resvg)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fontdue = "0.9"
ttf-parser = { version = "0.21", features = ["gvar-alloc"] }
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"], optional = true }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"], optional = true }
x11rb = { version = "0.14", optional = true, features = ["shape", "randr", "xfixes", "xtest", "composite", "damage", "xkb"] }

[features]
default = ["wayland", "x11"]
wayland = ["dep:smithay-client-toolkit", "dep:wayland-protocols"]
x11 = ["dep:x11rb"]
# TEST ONLY: compiles in a fake authenticator for declock (DECLOCK_FAKE_AUTH=1 + DECLOCK_TEST_PASSWORD). Never build
# release packages with it (PKGBUILD and the Makefile do not); tests/e2e/lock.sh checks the shipped binary lacks it.
test-auth = []
# TEST ONLY: deterministic slow/failing fsync for decsettings evidence runs (DECSETTINGS_FAULT_SYNC_*, see
# settings/io.rs `fault`). Off by default; never enable it for packages.
settings-io-fault = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "decsettings"
path = "src/bin/decsettings.rs"

[[bin]]
name = "decnotify"
path = "src/bin/decnotify.rs"
# Builds with either display backend (or neither: the daemon then reports that it has no display to draw on).

[[bin]]
name = "decwm"
path = "src/bin/decwm.rs"

[[bin]]
name = "declaunch"
path = "src/bin/declaunch.rs"

[[bin]]
name = "decspot"
path = "src/bin/decspot.rs"

[[bin]]
name = "decswitch"
path = "src/bin/decswitch.rs"
required-features = ["x11"]

[[bin]]
name = "dechud"
path = "src/bin/dechud.rs"
required-features = ["x11"]

[[bin]]
name = "declock"
path = "src/bin/declock.rs"
required-features = ["x11"]

[[bin]]
name = "decclip"
path = "src/bin/decclip.rs"
required-features = ["x11"]

[[bin]]
name = "dechot"
path = "src/bin/dechot.rs"
required-features = ["x11"]

[[bin]]
name = "decsession"
path = "src/bin/decsession.rs"

[[bin]]
name = "decutil"
path = "src/bin/decutil.rs"

[[bin]]
name = "decdash"
path = "src/bin/decdash.rs"
required-features = ["x11"]

[[bin]]
name = "decexpose"
path = "src/bin/decexpose.rs"
required-features = ["x11"]

[[bin]]
name = "decthemectl"
path = "src/bin/decthemectl.rs"
# Wallpaper thumbnails decode 4K-8K images: unusably slow unoptimised (debug runs and tests).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3

[[bin]]
name = "decwidgets"
path = "src/bin/decwidgets.rs"
required-features = ["x11"]
# fontdue parses every glyph of a face when it is opened (a 13 MB Inter collection): unusably slow unoptimised.
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

[[bin]]
name = "decmon"
path = "src/bin/decmon.rs"

[[bin]]
name = "decwall"
path = "src/bin/decwall.rs"

[[bin]]
name = "decnotes"
path = "src/bin/decnotes.rs"

[[bin]]
name = "dectimer"
path = "src/bin/dectimer.rs"

# QA-only inert window; never part of --bins or installed output.
[[example]]
name = "qa_wayland_first_frame"
path = "examples/qa_wayland_first_frame.rs"
required-features = ["wayland"]

# X11-only QA helper; not available in Wayland-only builds.
[[example]]
name = "fakewin"
path = "examples/fakewin.rs"
required-features = ["x11"]

# X11-only QA helper; not available in Wayland-only builds.
[[example]]
name = "clipowner"
path = "examples/clipowner.rs"
required-features = ["x11"]

# X11-only QA helper; not available in Wayland-only builds.
[[example]]
name = "x11-connect-check"
path = "examples/x11-connect-check.rs"
required-features = ["x11"]
