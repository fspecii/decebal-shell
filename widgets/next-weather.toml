format = 1
id = "next-weather"
name = "Next weather"
description = "Wide glass current-weather card, using the shared weather source on every theme."
size = [400, 192]
refresh = 1000

[root]
type = "col"
padding = 16
gap = 8
background = "dock@0.14"
radius = "theme"
border = "bar_text@0.32"
border_width = 1
on_click = "open dashboard"

[[root.children]]
type = "row"
width = 368
align = "center"
[[root.children.children]]
type = "col"
gap = 0
grow = 1
[[root.children.children.children]]
type = "text"
text = "Current weather"
size = 14
color = "bar_text@0.85"
[[root.children.children.children]]
type = "text"
text = "{weather.temp:int}°"
size = 48
color = "bar_text"
show_if = "weather.present"
[[root.children.children.children]]
type = "text"
text = "Waiting for data"
size = 20
color = "bar_text"
show_if = "!weather.present"
[[root.children.children]]
type = "icon"
name = "{weather.icon}"
size = 48
color = "bar_text@0.90"
show_if = "weather.present"
[[root.children]]
type = "spacer"
height = 18
[[root.children]]
type = "text"
text = "{clock:%A, %e %B}"
size = 12
color = "bar_text@0.80"
[[root.children]]
type = "text"
text = "Current temperature · Celsius"
size = 11
color = "bar_text@0.72"
show_if = "weather.present"
