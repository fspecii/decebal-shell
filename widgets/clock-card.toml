format = 1
id = "clock-card"
name = "Clock card"
description = "Big time, the date and the weather, on a translucent card."
size = [236, 136]
refresh = 1000

[root]
type = "col"
padding = [14, 20]
gap = 1
justify = "center"
background = "popup"
radius = "theme"
border = "border@0.6"
on_click = "open dashboard"

[[root.children]]
type = "text"
text = "{clock:%H:%M}"
size = 54
weight = "bold"

[[root.children]]
type = "text"
text = "{clock:%A, %e %B}"
size = 14
color = "text_secondary"

[[root.children]]
type = "row"
gap = 6
align = "center"
show_if = "weather.present"

[[root.children.children]]
type = "icon"
name = "{weather.icon}"
size = 16
color = "accent"

[[root.children.children]]
type = "text"
text = "{weather.temp:int}°C"
size = 13
color = "text_secondary"
