format = 1
id = "fetch-summary"
name = "Fastfetch summary"
description = "Real Fastfetch JSON system data, refreshed every minute; requires Fastfetch."
size = [380, 256]
refresh = 1000

[root]
type = "col"
padding = 18
gap = 8
align = "stretch"
background = "popup"
radius = "theme"
border = "border@0.6"
on_click = "open dashboard"

[[root.children]]
type = "text"
text = "FASTFETCH"
size = 12
color = "accent"
weight = "bold"

[[root.children]]
type = "text"
text = "{fetch.os|System information unavailable}"
size = 22
color = "text"
weight = "bold"

[[root.children]]
type = "text"
text = "Kernel  {fetch.kernel|Unavailable}"
size = 12
color = "text_secondary"

[[root.children]]
type = "text"
text = "CPU  {fetch.cpu|Unavailable}"
size = 12
color = "text"

[[root.children]]
type = "text"
text = "RAM  {fetch.mem_used:bytes|--} / {fetch.mem_total:bytes|--}"
size = 12
color = "text"

[[root.children]]
type = "text"
text = "Uptime  {fetch.uptime:dur|Unavailable}"
size = 12
color = "text"

[[root.children]]
type = "text"
text = "WM  {fetch.wm|Unavailable}"
size = 12
color = "text"

[[root.children]]
type = "text"
text = "{fetch.status|Fastfetch unavailable}"
size = 10
color = "text_secondary"
