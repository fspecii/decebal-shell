format = 1
id = "terminal-wave"
name = "Terminal wave"
description = "Terminal media controls with a waveform-shaped track progress meter; no audio capture or spectrum analysis."
size = [360, 272]
refresh = 1000

[root]
type = "col"
padding = 18
gap = 12
align = "stretch"
background = "popup"
radius = 2
border = "accent@0.6"

[[root.children]]
type = "text"
text = "$ music --wave"
size = 12
color = "ok"

[[root.children]]
type = "text"
text = "{media.title|Untitled track}"
size = 18
color = "text"
weight = "bold"
max_chars = 32
show_if = "media.present"

[[root.children]]
type = "text"
text = "{media.artist|Unknown artist}"
size = 12
color = "text_secondary"
max_chars = 40
show_if = "media.present"

[[root.children]]
type = "text"
text = "No player connected"
size = 18
color = "text"
show_if = "!media.present"

[[root.children]]
type = "row"
gap = 4
height = 56
align = "center"
show_if = "media.present"

