format = 1
id = "next-system"
name = "Next system"
description = "Glass resource dial with live CPU and memory usage, shared across themes."
size = [192, 192]
refresh = 1000

[root]
type = "col"
padding = 16
gap = 8
background = "dock@0.14"
radius = "theme"
border = "bar_text@0.32"
border_width = 1
on_click = "open dashboard"

[[root.children]]
type = "stack"
width = 160
height = 108
align = "center"
[[root.children.children]]
type = "ring"
value = "cpu.usage"
size = 104
thickness = 5
color = "bar_text@0.90"
track = "bar_text@0.18"
[[root.children.children]]
type = "col"
align = "center"
justify = "center"
gap = 2
[[root.children.children.children]]
type = "text"
text = "{cpu.usage:pct}"
size = 25
color = "bar_text"
[[root.children.children.children]]
type = "text"
text = "CPU"
size = 10
color = "bar_text@0.75"
[[root.children]]
type = "row"
width = 160
[[root.children.children]]
type = "text"
text = "Memory"
size = 11
color = "bar_text@0.80"
[[root.children.children]]
type = "spacer"
[[root.children.children]]
type = "text"
text = "{mem.usage:pct}"
size = 11
color = "bar_text@0.90"
[[root.children]]
type = "bar"
width = 160
height = 4
value = "mem.usage"
color = "bar_text@0.75"
track = "bar_text@0.15"
