format = 1
id = "terminal-session"
name = "Terminal session"
description = "A rice-style prompt with host, uptime and resource meters; opens the dashboard."
size = [320, 214]
refresh = 1000

[root]
type = "col"
padding = 16
gap = 10
align = "stretch"
background = "popup"
border = "accent@0.6"
radius = 2
on_click = "open dashboard"

[[root.children]]
type = "text"
text = "+-- SESSION ----------------+"
size = 12
color = "accent"
weight = "bold"

[[root.children]]
type = "text"
text = "{user.name|user}@{host.name|host} ~"
size = 16
color = "text"
weight = "bold"
max_chars = 25

[[root.children]]
type = "text"
text = "$ uptime  {uptime:dur|Unavailable}"
size = 12
color = "text_secondary"

[[root.children]]
type = "text"
text = "CPU  {cpu.usage:pct|--}    RAM  {mem.usage:pct|--}"
size = 12
color = "accent"

[[root.children]]
type = "bar"
value = "cpu.usage"
height = 6
color = "accent"
track = "border"

[[root.children]]
type = "bar"
value = "mem.usage"
height = 6
color = "ok"
track = "border"

[[root.children]]
type = "text"
text = "$ _"
size = 18
color = "ok"
