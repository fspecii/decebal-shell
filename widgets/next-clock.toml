format = 1
id = "next-clock"
name = "Next clock"
description = "A live monochrome analog dial on a transparent glass card, shared by every theme."
size = [192, 192]
refresh = 1000

[root]
type = "col"
padding = 16
background = "dock@0.14"
radius = "theme"
border = "bar_text@0.32"
border_width = 1
on_click = "open dashboard"

[[root.children]]
type = "analog-clock"
size = 160
color = "bar_text@0.90"
track = "bar_text@0.38"
second_color = "bar_text@0.80"
numerals = true
seconds = true
