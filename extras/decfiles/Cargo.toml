[package]
name = "decfiles"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional read-only Decebal Files foundation"

[workspace]

[dependencies]
gtk = { package = "gtk4", version = "=0.10.3" }
gio = "=0.21.5"
glib = "=0.21.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.dev]
debug = 0
incremental = false

