# Lingmo icon pack for the shared asset installer (contract: docs/desktop-asset-packs.md; the declared aliases below need the installer of commit 69d6107 of feat/claude-desktop-asset-packs).
# Data only. src/ holds the real artwork; upstream's cmake then copies links/ over it (14137 plain-text alias files) and adds <ctx>@2x / <ctx>@3x folder links. Both are DECLARED below, tree-pinned, and the installer applies them;
# nothing is run and nothing undeclared is guessed. No link_sources: neither src/ nor links/ contains a git symlink.
# The cursor themes are deliberately NOT catalogued: their repository names no licence file (the contract requires one per pack, and
# a template debian/copyright is not a grant). A user can still bring them in with `decthemectl assets import` and their own licence statement;
# the evidence is in docs/desktop-ports/lingmo/reference-recipes.toml and sources.json.
format = 1
family = "lingmo"

[[source]]
id = "lingmo-icon-theme"
repo = "https://github.com/LingmoOS/lingmo_icon_theme"
revision = "main"
commit = "0b6a4bab253154b786c51c9978960471fd98c88b"
license = "GPL-3.0-or-later"          # debian/copyright: GPL-3+ (Lingmo OS contributors); LICENSE is the GPL-3.0 text; derived from Colloid-icon-theme (GPL-3.0)
license_files = ["LICENSE"]
license_oids = ["e62ec04cdeece724caeeeeaeb6ae1f6af1bb6b9a"]   # git rev-parse 0b6a4ba:LICENSE: pins the licence text independently of the archive bytes
# the GitHub archive of exactly this commit: 4,975,741 bytes, pax comment = the commit, `src/` byte-identical to the local clone (10,396 files)
archive_url = "https://github.com/LingmoOS/lingmo_icon_theme/archive/0b6a4bab253154b786c51c9978960471fd98c88b.tar.gz"
archive_sha256 = "c5cbd4fa8dc246463f176dd12e81e68c84ecc432592d8c6c5c1bcf4aafff4043"
strip_components = 1

[[pack]]
id = "lingmo-icons"
name = "Lingmo"
provides = ["icons"]
source = "lingmo-icon-theme"
path = "src"                          # the theme folder (index.theme says Name=Cutefish, Inherits=hicolor,breeze); users select it as `Lingmo`
tree = "19ae41643ae10b340a88c6530c58e9d74e440ac9"    # git rev-parse 0b6a4ba:src
install_name = "Lingmo"
description = "Lingmo OS icon theme (Colloid derivative) with the multicolour systemlogo mark, installed with upstream's links/ aliases (14137 plain-text files, tree-pinned) and its @2x/@3x folder links. DISCLOSED: 33 upstream aliases dangle and are dropped; 2 alias names without an icon extension are left out by the installer's allowlist."

# Upstream's cmake/install-theme.cmake.in (read as text, never run): it copies src/<ctx>/ for 8 contexts, then copies links/<ctx>/ over the same folders (a links/ file wins over a src/ file of the same name: 15 names
# collide, hence replace = true), then creates <ctx>@2x -> <ctx> and <ctx>@3x -> <ctx>. Every links/ file is a regular blob (git mode 100644) whose text is a relative target: UTF-8, no newline, at most 75 bytes, none absolute,
# none leaving the theme (checked on the pinned tree). 14104 aliases resolve (some through another alias) and 33 dangle upstream; the installer drops the dangling ones with a warning.
[[pack.text_links]]
from = "links"
tree = "09d28c3591d256643c992999dc742b60336e6fc6"   # git rev-parse 0b6a4ba:links
replace = true                                      # upstream copies links/ over src/

[[pack.dir_alias]]
name = "actions@2x"
target = "actions"

[[pack.dir_alias]]
name = "actions@3x"
target = "actions"

[[pack.dir_alias]]
name = "apps@2x"
target = "apps"

[[pack.dir_alias]]
name = "apps@3x"
target = "apps"

[[pack.dir_alias]]
name = "categories@2x"
target = "categories"

[[pack.dir_alias]]
name = "categories@3x"
target = "categories"

[[pack.dir_alias]]
name = "devices@2x"
target = "devices"

[[pack.dir_alias]]
name = "devices@3x"
target = "devices"

[[pack.dir_alias]]
name = "emblems@2x"
target = "emblems"

[[pack.dir_alias]]
name = "emblems@3x"
target = "emblems"

[[pack.dir_alias]]
name = "mimetypes@2x"
target = "mimetypes"

[[pack.dir_alias]]
name = "mimetypes@3x"
target = "mimetypes"

[[pack.dir_alias]]
name = "places@2x"
target = "places"

[[pack.dir_alias]]
name = "places@3x"
target = "places"

[[pack.dir_alias]]
name = "status@2x"
target = "status"

[[pack.dir_alias]]
name = "status@3x"
target = "status"


[[recommend]]
theme = "lingmo"
icons = "lingmo-icons"
