# Deepin icon and cursor packs, pinned to the upstream they come from (decebal's installer fetches or imports and verifies them; nothing is
# copied into this repository, nothing from the upstream tree is executed). Contract: docs/desktop-asset-packs.md.
# Pins read from a local clone with read-only `git rev-parse` on 2026-10-31; licence from the repository's .reuse/dep5
# (bloom/* bloom-dark/* cursors-src/*: UnionTech Software Technology Co., Ltd., GPL-3.0-or-later).
format = 1
family = "deepin"

[[source]]
id = "deepin-icon-theme"
repo = "https://github.com/linuxdeepin/deepin-icon-theme"
revision = "master"
commit = "5d11ba4e4013a4d1e1c601265d55c66b95184922"
license = "GPL-3.0-or-later"
license_files = ["LICENSE", "LICENSES/GPL-3.0-or-later.txt", ".reuse/dep5"]
# git rev-parse 5d11ba4:<file>, same order as license_files: GitHub archives are not byte-stable (no archive_sha256), so these pin the licence texts
# that sit outside the pack trees; without them the installer marks the licences unverified
license_oids = ["94a9ed024d3859793618152ea559a168bbcbb5e2", "d41c0bd98feb776ef7d81efbc1b5447e0284a187", "acc35823e0f2b0632abd5ed4aa2b046833cf1a52"]
# GitHub archives are not byte-stable: no archive_sha256, the tree ids below pin the content
archive_url = "https://github.com/linuxdeepin/deepin-icon-theme/archive/5d11ba4e4013a4d1e1c601265d55c66b95184922.tar.gz"
strip_components = 1

# Bloom is what Deepin 25 selects out of the box for the toolkit: dde-services' org.deepin.XSettings.json (69fcd01) sets
# icon-theme-name "bloom" and gtk-cursor-theme-name "bloom" (size 24); the global theme nirvana only adds its own DCI icons on top (ICONS.md).
[[pack]]
id = "deepin-bloom"
name = "Bloom"
provides = ["icons", "cursors"]               # bloom/ has an icon tree and prebuilt Xcursor files (60 files, 116 alias links)
source = "deepin-icon-theme"
path = "bloom"
tree = "9baca758b5bb6a8b8423d32ce3f83da07b95af6e"
description = "Deepin's default freedesktop icon theme and its cursors (black arrow with a white outline)."

[[pack]]
id = "deepin-bloom-dark"
name = "Bloom Dark"
provides = ["icons", "cursors"]
source = "deepin-icon-theme"
path = "bloom-dark"
tree = "738f4c4a37c4b183ce9e573267b1b0d1b4dddb9e"   # Inherits=bloom,bloom-classic: install deepin-bloom too
description = "Dark-scheme overrides (devices, places, mimetypes) and the blue-outlined cursors; inherits Bloom."

# One recommendation per theme id, not per colour mode: Bloom in both (nirvana and the XSettings defaults name bloom for light and
# dark; bloom-dark drew the dock launcher glyph dim on the dark dock in the native captures).
[[recommend]]
theme = "deepin"
icons = "deepin-bloom"
cursors = "deepin-bloom"
