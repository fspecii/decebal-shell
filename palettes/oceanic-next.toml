# Source research: docs/rice-palettes.md and docs/palette-sources.json
# Original scheme author: https://github.com/voronianski/oceanic-next-color-scheme
# Source: https://github.com/tinted-theming/schemes/blob/dd2a1379533372ad79560bb4392570782a8a0a9d/base16/oceanicnext.yaml
