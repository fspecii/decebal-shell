name = "Atelier Forest"
description = "Atelier Forest Base16 source colours, mapped for readable desktop surfaces."

# source dark/light variant mapped to Decebal roles
# https://github.com/tinted-theming/schemes/blob/dd2a1379533372ad79560bb4392570782a8a0a9d/base16/atelier-forest.yaml
[dark]
background = "#1b1918" # base00
sidebar = "#1b1918" # base00
surface = "#2c2421" # base01
bar = "#1b1918" # base00
bar_text = "#f1efee" # base07
popup = "#2c2421" # base01
dock = "#1b1918" # base00
overlay = "#2c2421" # base01
titlebar = "#2c2421" # base01
titlebar_inactive = "#1b1918" # base00
border = "#68615e" # base02
text = "#f1efee" # base07
text_secondary = "#9c9491" # base04
text_faint = "#766e6b" # base03
accent = "#7b9726" # base0B
accent_text = "#1b1918" # base00
danger = "#f22c40" # base08
ok = "#7b9726" # base0B
warn = "#c38418" # base0A

# source dark/light variant mapped to Decebal roles
