name = "Material"
description = "Material Base16 source colours, mapped for readable desktop surfaces."

# source dark/light variant mapped to Decebal roles
# https://github.com/tinted-theming/schemes/blob/dd2a1379533372ad79560bb4392570782a8a0a9d/base16/material.yaml
[dark]
background = "#263238" # base00
sidebar = "#263238" # base00
surface = "#2e3c43" # base01
bar = "#263238" # base00
bar_text = "#ffffff" # base07
popup = "#2e3c43" # base01
dock = "#263238" # base00
overlay = "#2e3c43" # base01
titlebar = "#2e3c43" # base01
titlebar_inactive = "#263238" # base00
border = "#314549" # base02
text = "#ffffff" # base07
text_secondary = "#b2ccd6" # base04
