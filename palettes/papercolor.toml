name = "PaperColor"
description = "PaperColor Base16 source colours, mapped for readable desktop surfaces."

# source dark/light variant mapped to Decebal roles
# https://github.com/tinted-theming/schemes/blob/dd2a1379533372ad79560bb4392570782a8a0a9d/base16/papercolor-dark.yaml
[dark]
background = "#1c1c1c" # base00
sidebar = "#1c1c1c" # base00
surface = "#363636" # base01
bar = "#1c1c1c" # base00
bar_text = "#d0d0d0" # base07
popup = "#363636" # base01
dock = "#1c1c1c" # base00
overlay = "#363636" # base01
titlebar = "#363636" # base01
titlebar_inactive = "#1c1c1c" # base00
border = "#424242" # base02
text = "#d0d0d0" # base07
text_secondary = "#9e9e9e" # base05
text_faint = "#808080" # base04
accent = "#5fafd7" # base0D
accent_text = "#1c1c1c" # base00
danger = "#ff5faf" # base08
ok = "#5faf5f" # base0B
warn = "#ffaf00" # base0A

# source dark/light variant mapped to Decebal roles
# https://github.com/tinted-theming/schemes/blob/dd2a1379533372ad79560bb4392570782a8a0a9d/base16/papercolor-light.yaml
[light]
background = "#eeeeee" # base00
sidebar = "#eeeeee" # base00
surface = "#c4c4c4" # base01
bar = "#eeeeee" # base00
bar_text = "#444444" # base07
popup = "#c4c4c4" # base01
dock = "#eeeeee" # base00
overlay = "#c4c4c4" # base01
titlebar = "#c4c4c4" # base01
titlebar_inactive = "#eeeeee" # base00
border = "#9e9e9e" # base02
text = "#444444" # base07
text_secondary = "#444444" # base07
text_faint = "#6b6b6b" # base04
accent = "#005f87" # base0D
accent_text = "#eeeeee" # base00
danger = "#d70000" # base08
ok = "#097e09" # base0B ; Decebal contrast adaptation
warn = "#a75616" # base0A ; Decebal contrast adaptation
