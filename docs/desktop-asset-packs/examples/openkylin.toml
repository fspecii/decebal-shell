# Example companion catalogue for an openKylin (UKUI) port. Pins from `git rev-parse` on 2026-10-31.
# openKylin's own dark-sense cursors are PNGs that upstream turns into Xcursor files with a shell script
# (icons/cursors/dark-sense/cursors.sh). Their hotspots and aliases are below as data ([[pack.xcursor]], produced from
# the script's text by docs/desktop-asset-packs/xcursorgen2toml.py; the script is never run); decebal builds the
# cursors natively. DMZ (also shipped by openKylin) stays available.
format = 1
family = "openkylin"

[[source]]
id = "openkylin-theme"
repo = "https://gitee.com/openkylin/openkylin-theme"
revision = "openkylin/nile"
commit = "3c78d714aa8fac723c9a5360bd54484789a647ab"
license = "GPL-3.0-only"                      # debian/copyright: "either version 3 of the License."
license_files = ["debian/copyright"]
license_oids = ["0558d3ef9a8e18f6d442f58751d0c8b7902a0796"]   # git rev-parse <commit>:<file>, same order
strip_components = 1                          # forge / git archive --prefix tarballs wrap one folder; --source-dir ignores it

[[source]]
id = "dmz-cursor-theme"
repo = "https://gitee.com/openkylin/dmz-cursor-theme"
revision = "openkylin/yangtze"
commit = "54eb2bd971b033af69f1cea9881bc2a676aee943"
license = "CC-BY-SA-3.0"                      # debian/copyright: "License for the theme itself"
license_files = ["debian/copyright"]
license_oids = ["84660fb0874b89bd5fe1429b3b19e7f1e6f9bf8a"]   # git rev-parse <commit>:<file>, same order
strip_components = 1                          # forge / git archive --prefix tarballs wrap one folder; --source-dir ignores it

