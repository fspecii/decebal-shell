# decebal's own companion catalogue: the upstream icon / cursor packs the coverage table (themes.toml) needs that no
# port catalogue provides. Pins from `git rev-parse` on 2026-10-31 (the same pins as docs/desktop-asset-packs/examples);
# fetched with `git_url` (only the pinned objects). A port owner who wants to own one of these packs adds it to their
# catalogue under its own id and points the coverage entry at it.
