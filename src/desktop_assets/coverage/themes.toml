# Which icon (and cursor) pack a theme applies when its port catalogue has no [[recommend]] for it and the theme's own
# `[icons] theme` is not available. Every theme in themes/ is covered (a test fails otherwise); a port catalogue's
# [[recommend]] always wins over this table.
#
# basis = "upstream": the icons of the desktop the theme recreates.
# basis = "manifest": the icon theme the theme's own manifest names, as a pinned pack.
# basis = "fallback": no free matching set exists or is pinned yet; a coherent, honestly named pack instead. Fallbacks
#                     are never relabelled as the theme's own icons: the pack keeps its upstream name and licence.
format = 1

[[cover]]
theme = "aster"
icons = "decebal-adwaita"
basis = "manifest"
reason = "the theme names Adwaita"

[[cover]]
theme = "brutalist"
icons = "gnome-papirus-dark"
basis = "fallback"
reason = "no icon set of its own; flat high-contrast Papirus-Dark suits black and signal yellow"

